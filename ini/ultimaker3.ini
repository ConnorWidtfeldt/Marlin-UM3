# UM3 development targets. The stock Marlin configuration is retained for regression.
[um3_avr_pinned]
platform = atmelavr@4.0.1
platform_packages =
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/framework-arduino-avr@5.1.0

[env:um3_upstream_check]
extends = env:mega2560, um3_avr_pinned
extra_scripts =
    pre:buildroot/share/ultimaker3/reproducible.py
    ${common.extra_scripts}
build_flags = ${common_avr8.build_flags} -Wl,-Map,${platformio.build_dir}/${this.__env__}/firmware.map

# Experimental complete UM3 image; hardware acceptance is a separate gate.
[env:um3_extended]
extends = env:mega2560ext, um3_avr_pinned
build_src_filter = ${common_avr8.build_src_filter} +<src/feature/ultimaker3>
extra_scripts =
    pre:buildroot/share/ultimaker3/reproducible.py
    ${env:mega2560ext.extra_scripts}
build_flags = ${common_avr8.build_flags} -DUM3_COMPATIBILITY
              -Wl,-Map,${platformio.build_dir}/${this.__env__}/firmware.map
board_upload.maximum_size = 253952
board_upload.maximum_ram_size = 6144
