name: UM3 development checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.pio-core
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r buildroot/share/ultimaker3/requirements.txt
      - run: python buildroot/tests/um3/test_evidence.py
      - run: python buildroot/tests/um3/run.py
      - run: python buildroot/tests/um3/run_thermal.py
      - run: python buildroot/tests/um3/run_interlock.py
      - run: python buildroot/tests/um3/run_motion.py
      - run: python buildroot/tests/um3/run_power.py
      - run: python buildroot/tests/um3/run_integration.py
      - run: pio run -e um3_upstream_check
      - run: python buildroot/share/ultimaker3/verify.py avr-components --core "$PLATFORMIO_CORE_DIR"
      - name: Build experimental UM3 Extended image
        run: pio run -e um3_extended
      - run: python buildroot/share/ultimaker3/verify.py build-report --core "$PLATFORMIO_CORE_DIR" --environment um3_extended --output artifacts/um3-extended-NOT-FOR-FLASHING
      - run: python buildroot/share/ultimaker3/verify.py build-report --core "$PLATFORMIO_CORE_DIR" --environment um3_upstream_check --output artifacts/upstream-avr-regression
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-avr-regression-NOT-UM3-FIRMWARE
          path: artifacts/upstream-avr-regression
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: um3-extended-NOT-FOR-FLASHING
          path: artifacts/um3-extended-NOT-FOR-FLASHING
          if-no-files-found: error
